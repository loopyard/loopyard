{
  "services": {
    "dev": {
      "build": ".",
      "command": "bin/dev",
      "depends_on": [
        "postgres",
        "redis"
      ],
      "environment": [
        "BINDING=0.0.0.0",
        "DB_HOST=postgres",
        "DB_PORT=5432",
        "POSTGRES_USER=postgres",
        "POSTGRES_PASSWORD=postgres",
        "REDIS_URL=redis://redis:6379/0",
        "DISABLE_SPRING=1",
        "BUNDLE_PATH=/usr/local/bundle",
        "SECRET_KEY_BASE=development-secret-key-base-not-for-production",
        "SELF_HOSTED=true"
      ],
      "ports": [
        "127.0.0.1::3000"
      ],
      "volumes": [
        "code:/workspace"
      ],
      "working_dir": "/workspace"
    },
    "postgres": {
      "environment": [
        "POSTGRES_HOST_AUTH_METHOD=trust"
      ],
      "image": "postgres:16",
      "volumes": [
        "postgres-data:/var/lib/postgresql/data"
      ]
    },
    "redis": {
      "image": "redis:7-alpine"
    },
    "workspace": {
      "build": ".",
      "command": "sleep infinity",
      "environment": [
        "BINDING=0.0.0.0",
        "DB_HOST=postgres",
        "DB_PORT=5432",
        "POSTGRES_USER=postgres",
        "POSTGRES_PASSWORD=postgres",
        "REDIS_URL=redis://redis:6379/0",
        "DISABLE_SPRING=1",
        "BUNDLE_PATH=/usr/local/bundle",
        "SECRET_KEY_BASE=development-secret-key-base-not-for-production",
        "SELF_HOSTED=true"
      ],
      "volumes": [
        "code:/workspace"
      ],
      "working_dir": "/workspace"
    }
  },
  "volumes": {
    "bl-848d-code": {
      "external": true
    },
    "code": {
      "external": true,
      "name": "bl-848d-code"
    },
    "postgres-data": null
  }
}