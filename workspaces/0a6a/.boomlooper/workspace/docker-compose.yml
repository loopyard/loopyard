{
  "services": {
    "css": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "target": "dev"
      },
      "command": "bin/rails tailwindcss:watch[always]",
      "depends_on": {
        "dev": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "PGHOST": "postgres",
        "PGUSER": "postgres",
        "RAILS_ENV": "development",
        "REDIS_URL": "redis://redis:6379/0"
      },
      "volumes": [
        "bl-0a6a-code:/workspace",
        "bundle_cache:/usr/local/bundle"
      ]
    },
    "dev": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "target": "dev"
      },
      "command": "bash -c \"bundle install --quiet && npm install --silent && rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000\"",
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "BINDING": "0.0.0.0",
        "NODE_ENV": "development",
        "PGHOST": "postgres",
        "PGUSER": "postgres",
        "PORT": "3000",
        "RAILS_ENV": "development",
        "REDIS_URL": "redis://redis:6379/0"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "180s",
        "test": [
          "CMD",
          "curl",
          "-f",
          "http://localhost:3000/up"
        ],
        "timeout": "5s"
      },
      "ports": [
        "32829:3000"
      ],
      "volumes": [
        "bl-0a6a-code:/workspace",
        "bundle_cache:/usr/local/bundle"
      ]
    },
    "js": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "target": "dev"
      },
      "command": "npx esbuild app/javascript/react/*.tsx --bundle --sourcemap --format=iife --outdir=app/assets/builds --loader:.tsx=tsx --watch=forever",
      "depends_on": {
        "dev": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "NODE_ENV": "development"
      },
      "volumes": [
        "bl-0a6a-code:/workspace",
        "bundle_cache:/usr/local/bundle"
      ]
    },
    "postgres": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "target": "postgres"
      },
      "environment": {
        "POSTGRES_HOST_AUTH_METHOD": "trust",
        "POSTGRES_USER": "postgres"
      },
      "healthcheck": {
        "interval": "3s",
        "retries": 10,
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ],
        "timeout": "3s"
      },
      "ports": [
        "32828:5432"
      ],
      "volumes": [
        "pgdata:/var/lib/postgresql/data"
      ]
    },
    "redis": {
      "healthcheck": {
        "interval": "3s",
        "retries": 10,
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "timeout": "3s"
      },
      "image": "redis:7-alpine",
      "ports": [
        "32827:6379"
      ]
    },
    "worker": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "target": "dev"
      },
      "command": "bundle exec bin/rails solid_queue:start",
      "depends_on": {
        "dev": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "PGHOST": "postgres",
        "PGUSER": "postgres",
        "RAILS_ENV": "development",
        "REDIS_URL": "redis://redis:6379/0"
      },
      "volumes": [
        "bl-0a6a-code:/workspace",
        "bundle_cache:/usr/local/bundle"
      ]
    }
  },
  "volumes": {
    "bl-0a6a-code": {
      "external": true
    },
    "bundle_cache": null,
    "pgdata": null
  }
}