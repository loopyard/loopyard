services:
  workspace:
    build: .
    command: sleep infinity
    volumes:
      - code:/workspace
    working_dir: /workspace
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - VIRTUAL_ENV=/workspace/.venv
      - PATH=/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin

  dev:
    build: .
    command: pnpm dev
    ports:
      - "3000"
      - "3001"
      - "3002"
      - "3100"
    volumes:
      - code:/workspace
    working_dir: /workspace
    environment:
      - VITE_API_BASE_URL=http://api:8000
      - VITE_WEB_BASE_URL=http://localhost:3000
      - VITE_ADMIN_BASE_URL=http://localhost:3001
      - VITE_ADMIN_BASE_PATH=/god-mode
      - VITE_SPACE_BASE_URL=http://localhost:3002
      - VITE_SPACE_BASE_PATH=/spaces
      - VITE_LIVE_BASE_URL=http://localhost:3100
      - VITE_LIVE_BASE_PATH=/live
    depends_on:
      - api

  api:
    build: .
    command: >
      bash -c "
        cd /workspace/apps/api &&
        python manage.py wait_for_db &&
        python manage.py wait_for_migrations &&
        python manage.py register_instance 'dev' || true &&
        python manage.py configure_instance || true &&
        python manage.py create_bucket || true &&
        python manage.py runserver 0.0.0.0:8000 --settings=plane.settings.local
      "
    ports:
      - "8000"
    volumes:
      - code:/workspace
    working_dir: /workspace/apps/api
    environment:
      - VIRTUAL_ENV=/workspace/.venv
      - PATH=/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DEBUG=1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3100
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=plane
      - POSTGRES_HOST=plane-db
      - POSTGRES_DB=plane
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://plane:plane@plane-db:5432/plane
      - REDIS_HOST=plane-redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://plane-redis:6379/
      - RABBITMQ_HOST=plane-mq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=plane
      - RABBITMQ_PASSWORD=plane
      - RABBITMQ_VHOST=plane
      - AWS_REGION=
      - AWS_ACCESS_KEY_ID=access-key
      - AWS_SECRET_ACCESS_KEY=secret-key
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_S3_BUCKET_NAME=uploads
      - FILE_SIZE_LIMIT=5242880
      - USE_MINIO=1
      - DOCKERIZED=1
      - SECRET_KEY=dev-secret-key-change-in-production-00000000
      - WEB_URL=http://localhost:3000
      - ADMIN_BASE_URL=http://localhost:3001
      - ADMIN_BASE_PATH=/god-mode
      - SPACE_BASE_URL=http://localhost:3002
      - SPACE_BASE_PATH=/spaces
      - APP_BASE_URL=http://localhost:3000
      - APP_BASE_PATH=
      - LIVE_BASE_URL=http://localhost:3100
      - LIVE_BASE_PATH=/live
      - LIVE_SERVER_SECRET_KEY=secret-key
      - GUNICORN_WORKERS=2
      - MINIO_ENDPOINT_SSL=0
      - API_KEY_RATE_LIMIT=60/minute
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
      - plane-minio

  worker:
    build: .
    command: >
      bash -c "
        cd /workspace/apps/api &&
        python manage.py wait_for_db &&
        python manage.py wait_for_migrations &&
        celery -A plane worker -l info
      "
    volumes:
      - code:/workspace
    working_dir: /workspace/apps/api
    environment:
      - VIRTUAL_ENV=/workspace/.venv
      - PATH=/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://plane:plane@plane-db:5432/plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=plane
      - POSTGRES_HOST=plane-db
      - POSTGRES_DB=plane
      - POSTGRES_PORT=5432
      - REDIS_HOST=plane-redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://plane-redis:6379/
      - RABBITMQ_HOST=plane-mq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=plane
      - RABBITMQ_PASSWORD=plane
      - RABBITMQ_VHOST=plane
      - AWS_ACCESS_KEY_ID=access-key
      - AWS_SECRET_ACCESS_KEY=secret-key
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_S3_BUCKET_NAME=uploads
      - USE_MINIO=1
      - SECRET_KEY=dev-secret-key-change-in-production-00000000
      - MINIO_ENDPOINT_SSL=0
    depends_on:
      - api

  beat-worker:
    build: .
    command: >
      bash -c "
        cd /workspace/apps/api &&
        python manage.py wait_for_db &&
        python manage.py wait_for_migrations &&
        celery -A plane beat -l info
      "
    volumes:
      - code:/workspace
    working_dir: /workspace/apps/api
    environment:
      - VIRTUAL_ENV=/workspace/.venv
      - PATH=/workspace/.venv/bin:/usr/local/bin:/usr/bin:/bin
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://plane:plane@plane-db:5432/plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=plane
      - POSTGRES_HOST=plane-db
      - POSTGRES_DB=plane
      - POSTGRES_PORT=5432
      - REDIS_HOST=plane-redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://plane-redis:6379/
      - RABBITMQ_HOST=plane-mq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=plane
      - RABBITMQ_PASSWORD=plane
      - RABBITMQ_VHOST=plane
      - AWS_ACCESS_KEY_ID=access-key
      - AWS_SECRET_ACCESS_KEY=secret-key
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_S3_BUCKET_NAME=uploads
      - USE_MINIO=1
      - SECRET_KEY=dev-secret-key-change-in-production-00000000
      - MINIO_ENDPOINT_SSL=0
    depends_on:
      - api

  plane-db:
    image: postgres:15.7-alpine
    environment:
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=plane
      - POSTGRES_DB=plane
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=plane
      - RABBITMQ_DEFAULT_PASS=plane
      - RABBITMQ_DEFAULT_VHOST=plane

  plane-minio:
    image: minio/minio
    command: server /export --console-address ':9090'
    environment:
      - MINIO_ROOT_USER=access-key
      - MINIO_ROOT_PASSWORD=secret-key
    volumes:
      - uploads:/export
    ports:
      - "9000"
      - "9090"

volumes:
  code:
    external: true
    name: bl-efa1-code
  pgdata:
  redisdata:
  uploads:
