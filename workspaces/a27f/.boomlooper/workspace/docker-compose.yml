{
  "services": {
    "dev": {
      "build": ".",
      "command": "sh -c \"php artisan serve --host=0.0.0.0 --port=8000 & npm run dev -- --host=0.0.0.0 & wait\"",
      "depends_on": [
        "mysql"
      ],
      "environment": [
        "APP_ENV=local",
        "APP_DEBUG=true",
        "DB_CONNECTION=mysql",
        "DB_HOST=mysql",
        "DB_PORT=3306",
        "DB_DATABASE=bookstack",
        "DB_USERNAME=root",
        "DB_PASSWORD=",
        "MAIL_HOST=mailpit",
        "MAIL_PORT=1025"
      ],
      "ports": [
        "127.0.0.1:4002:8000"
      ],
      "volumes": [
        "code:/workspace"
      ],
      "working_dir": "/workspace"
    },
    "mailpit": {
      "image": "axllent/mailpit"
    },
    "mysql": {
      "environment": [
        "MYSQL_ALLOW_EMPTY_PASSWORD=yes",
        "MYSQL_DATABASE=bookstack"
      ],
      "image": "mysql:8",
      "volumes": [
        "mysql-data:/var/lib/mysql"
      ]
    },
    "workspace": {
      "build": ".",
      "command": "sleep infinity",
      "environment": [
        "APP_ENV=local",
        "APP_DEBUG=true",
        "DB_CONNECTION=mysql",
        "DB_HOST=mysql",
        "DB_PORT=3306",
        "DB_DATABASE=bookstack",
        "DB_USERNAME=root",
        "DB_PASSWORD=",
        "MAIL_HOST=mailpit",
        "MAIL_PORT=1025"
      ],
      "volumes": [
        "code:/workspace"
      ],
      "working_dir": "/workspace"
    }
  },
  "volumes": {
    "bl-a27f-code": {
      "external": true
    },
    "code": {
      "external": true,
      "name": "bl-a27f-code"
    },
    "mysql-data": null
  }
}