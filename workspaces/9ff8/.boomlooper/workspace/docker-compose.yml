{
  "services": {
    "dev": {
      "build": ".",
      "command": "foreman start -f Procfile.dev",
      "depends_on": [
        "postgres",
        "redis"
      ],
      "environment": [
        "BINDING=0.0.0.0",
        "HOST=0.0.0.0",
        "RAILS_ENV=development",
        "NODE_ENV=development",
        "POSTGRES_HOST=postgres",
        "POSTGRES_USERNAME=postgres",
        "POSTGRES_PASSWORD=",
        "POSTGRES_DATABASE=chatwoot_dev",
        "REDIS_URL=redis://redis:6379",
        "SECRET_KEY_BASE=dev_secret_key_base_chatwoot_local_development_only_replace_in_prod",
        "FRONTEND_URL=http://0.0.0.0:3000",
        "RAILS_LOG_TO_STDOUT=true",
        "LOG_LEVEL=info",
        "DISABLE_SPRING=1",
        "BUNDLE_PATH=/usr/local/bundle",
        "INSTALLATION_ENV=docker",
        "ENABLE_ACCOUNT_SIGNUP=true"
      ],
      "ports": [
        "127.0.0.1:4005:3000"
      ],
      "volumes": [
        "code:/workspace",
        "bundle:/usr/local/bundle"
      ],
      "working_dir": "/workspace"
    },
    "postgres": {
      "environment": [
        "POSTGRES_HOST_AUTH_METHOD=trust"
      ],
      "image": "pgvector/pgvector:pg16",
      "volumes": [
        "postgres-data:/var/lib/postgresql/data"
      ]
    },
    "redis": {
      "image": "redis:7-alpine"
    },
    "workspace": {
      "build": ".",
      "command": "sleep infinity",
      "depends_on": [
        "postgres",
        "redis"
      ],
      "environment": [
        "BINDING=0.0.0.0",
        "RAILS_ENV=development",
        "NODE_ENV=development",
        "POSTGRES_HOST=postgres",
        "POSTGRES_USERNAME=postgres",
        "POSTGRES_PASSWORD=",
        "POSTGRES_DATABASE=chatwoot_dev",
        "REDIS_URL=redis://redis:6379",
        "SECRET_KEY_BASE=dev_secret_key_base_chatwoot_local_development_only_replace_in_prod",
        "FRONTEND_URL=http://0.0.0.0:3000",
        "RAILS_LOG_TO_STDOUT=true",
        "LOG_LEVEL=info",
        "DISABLE_SPRING=1",
        "BUNDLE_PATH=/usr/local/bundle",
        "INSTALLATION_ENV=docker",
        "ENABLE_ACCOUNT_SIGNUP=true"
      ],
      "volumes": [
        "code:/workspace",
        "bundle:/usr/local/bundle"
      ],
      "working_dir": "/workspace"
    }
  },
  "volumes": {
    "bl-9ff8-code": {
      "external": true
    },
    "bundle": null,
    "code": {
      "external": true,
      "name": "bl-9ff8-code"
    },
    "postgres-data": null
  }
}