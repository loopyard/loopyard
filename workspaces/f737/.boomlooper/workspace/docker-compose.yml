{
  "services": {
    "css": {
      "<<23": {
        "build": {
          "context": ".",
          "dockerfile": "Dockerfile",
          "target": "dev"
        },
        "depends_on": {
          "postgres": {
            "condition": "service_healthy"
          },
          "redis": {
            "condition": "service_healthy"
          }
        },
        "environment": {
          "BINDING": "0.0.0.0",
          "NODE_ENV": "development",
          "PGHOST": "postgres",
          "PGUSER": "postgres",
          "PORT": "3000",
          "RAILS_ENV": "development",
          "REDIS_URL": "redis://redis:6379/0"
        },
        "volumes": [
          "${CODE_VOLUME}:/workspace",
          "bundle_cache:/usr/local/bundle"
        ]
      },
      "command": "bin/rails tailwindcss:watch[always]",
      "depends_on": {
        "dev": {
          "condition": "service_started"
        }
      }
    },
    "dev": {
      "<<22": {
        "build": {
          "context": ".",
          "dockerfile": "Dockerfile",
          "target": "dev"
        },
        "depends_on": {
          "postgres": {
            "condition": "service_healthy"
          },
          "redis": {
            "condition": "service_healthy"
          }
        },
        "environment": {
          "BINDING": "0.0.0.0",
          "NODE_ENV": "development",
          "PGHOST": "postgres",
          "PGUSER": "postgres",
          "PORT": "3000",
          "RAILS_ENV": "development",
          "REDIS_URL": "redis://redis:6379/0"
        },
        "volumes": [
          "${CODE_VOLUME}:/workspace",
          "bundle_cache:/usr/local/bundle"
        ]
      },
      "command": "bash -c \"bundle install --quiet && rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0 -p 3000\"",
      "ports": [
        "3000"
      ]
    },
    "js": {
      "<<24": {
        "build": {
          "context": ".",
          "dockerfile": "Dockerfile",
          "target": "dev"
        },
        "depends_on": {
          "postgres": {
            "condition": "service_healthy"
          },
          "redis": {
            "condition": "service_healthy"
          }
        },
        "environment": {
          "BINDING": "0.0.0.0",
          "NODE_ENV": "development",
          "PGHOST": "postgres",
          "PGUSER": "postgres",
          "PORT": "3000",
          "RAILS_ENV": "development",
          "REDIS_URL": "redis://redis:6379/0"
        },
        "volumes": [
          "${CODE_VOLUME}:/workspace",
          "bundle_cache:/usr/local/bundle"
        ]
      },
      "command": "npx esbuild app/javascript/react/*.tsx --bundle --sourcemap --format=iife --outdir=app/assets/builds --loader:.tsx=tsx --watch=forever",
      "depends_on": {
        "dev": {
          "condition": "service_started"
        }
      }
    },
    "postgres": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "target": "postgres"
      },
      "environment": {
        "POSTGRES_HOST_AUTH_METHOD": "trust",
        "POSTGRES_USER": "postgres"
      },
      "healthcheck": {
        "interval": "3s",
        "retries": 10,
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ],
        "timeout": "3s"
      },
      "ports": [
        "5432"
      ],
      "volumes": [
        "pgdata:/var/lib/postgresql/data"
      ]
    },
    "redis": {
      "healthcheck": {
        "interval": "3s",
        "retries": 10,
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "timeout": "3s"
      },
      "image": "redis:7-alpine",
      "ports": [
        "6379"
      ]
    },
    "worker": {
      "<<25": {
        "build": {
          "context": ".",
          "dockerfile": "Dockerfile",
          "target": "dev"
        },
        "depends_on": {
          "postgres": {
            "condition": "service_healthy"
          },
          "redis": {
            "condition": "service_healthy"
          }
        },
        "environment": {
          "BINDING": "0.0.0.0",
          "NODE_ENV": "development",
          "PGHOST": "postgres",
          "PGUSER": "postgres",
          "PORT": "3000",
          "RAILS_ENV": "development",
          "REDIS_URL": "redis://redis:6379/0"
        },
        "volumes": [
          "${CODE_VOLUME}:/workspace",
          "bundle_cache:/usr/local/bundle"
        ]
      },
      "command": "bundle exec bin/rails solid_queue:start",
      "depends_on": {
        "dev": {
          "condition": "service_started"
        }
      }
    }
  },
  "volumes": {
    "bl-f737-code": {
      "external": true
    },
    "bundle_cache": null,
    "pgdata": null
  },
