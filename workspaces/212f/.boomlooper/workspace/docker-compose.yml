{
  "services": {
    "admin": {
      "build": {
        "context": "../..",
        "dockerfile": ".boomlooper/workspace/Dockerfile"
      },
      "command": "bash -lc \" cd /workspace && pnpm --filter=admin dev --host 0.0.0.0 \"\n",
      "environment": [
        "HOST=0.0.0.0",
        "NODE_ENV=development",
        "VITE_API_BASE_URL=",
        "VITE_WEB_BASE_URL=",
        "VITE_ADMIN_BASE_URL=",
        "VITE_ADMIN_BASE_PATH=/god-mode",
        "VITE_SPACE_BASE_URL=",
        "VITE_SPACE_BASE_PATH=/spaces",
        "VITE_LIVE_BASE_URL=",
        "VITE_LIVE_BASE_PATH=/live"
      ],
      "restart": "unless-stopped",
      "volumes": [
        "code:/workspace",
        "pnpm-store:/pnpm"
      ],
      "working_dir": "/workspace"
    },
    "api": {
      "build": {
        "context": "../..",
        "dockerfile": ".boomlooper/workspace/Dockerfile"
      },
      "command": "bash -lc \" cd /workspace/apps/api && python manage.py wait_for_db --settings=plane.settings.local && python manage.py migrate --settings=plane.settings.local && python manage.py register_instance $(hostname) --settings=plane.settings.local || true && python manage.py configure_instance --settings=plane.settings.local || true && python manage.py runserver 0.0.0.0:8000 --settings=plane.settings.local \"\n",
      "depends_on": [
        "plane-db",
        "plane-redis",
        "plane-mq"
      ],
      "environment": [
        "DJANGO_SETTINGS_MODULE=plane.settings.local",
        "DATABASE_URL=postgresql://plane:plane@plane-db:5432/plane",
        "POSTGRES_USER=plane",
        "POSTGRES_PASSWORD=plane",
        "POSTGRES_HOST=plane-db",
        "POSTGRES_DB=plane",
        "POSTGRES_PORT=5432",
        "REDIS_URL=redis://plane-redis:6379/",
        "REDIS_HOST=plane-redis",
        "REDIS_PORT=6379",
        "RABBITMQ_HOST=plane-mq",
        "RABBITMQ_PORT=5672",
        "RABBITMQ_USER=plane",
        "RABBITMQ_PASSWORD=plane",
        "RABBITMQ_VHOST=plane",
        "SECRET_KEY=dev-secret-key-not-for-production",
        "DEBUG=1",
        "ALLOWED_HOSTS=*",
        "CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost",
        "CORS_ALLOW_ALL_ORIGINS=1",
        "USE_MINIO=0",
        "AWS_ACCESS_KEY_ID=access-key",
        "AWS_SECRET_ACCESS_KEY=secret-key",
        "AWS_S3_BUCKET_NAME=uploads",
        "WEB_URL=http://localhost",
        "APP_BASE_URL=http://localhost",
        "ADMIN_BASE_URL=http://localhost",
        "ADMIN_BASE_PATH=/god-mode",
        "SPACE_BASE_URL=http://localhost",
        "SPACE_BASE_PATH=/spaces",
        "SKIP_ENV_VAR=1",
        "GUNICORN_WORKERS=1",
        "APP_VERSION=1.3.0"
      ],
      "ports": [
        "127.0.0.1:4008:8000"
      ],
      "restart": "unless-stopped",
      "volumes": [
        "code:/workspace",
        "venv:/opt/venv"
      ],
      "working_dir": "/workspace/apps/api"
    },
    "dev": {
      "command": "caddy run --config /workspace/.boomlooper/workspace/Caddyfile --adapter caddyfile",
      "depends_on": [
        "web",
        "admin",
        "api"
      ],
      "image": "caddy:2.10-alpine",
      "ports": [
        "127.0.0.1:4010:80"
      ],
      "restart": "unless-stopped",
      "volumes": [
        "code:/workspace"
      ]
    },
    "plane-db": {
      "command": "postgres -c 'max_connections=200'",
      "environment": [
        "POSTGRES_USER=plane",
        "POSTGRES_PASSWORD=plane",
        "POSTGRES_DB=plane",
        "POSTGRES_HOST_AUTH_METHOD=trust"
      ],
      "image": "postgres:15.7-alpine",
      "volumes": [
        "pgdata:/var/lib/postgresql/data"
      ]
    },
    "plane-mq": {
      "environment": [
        "RABBITMQ_DEFAULT_USER=plane",
        "RABBITMQ_DEFAULT_PASS=plane",
        "RABBITMQ_DEFAULT_VHOST=plane"
      ],
      "image": "rabbitmq:3.13.6-management-alpine",
      "volumes": [
        "rabbitmq_data:/var/lib/rabbitmq"
      ]
    },
    "plane-redis": {
      "image": "valkey/valkey:7.2.11-alpine",
      "volumes": [
        "redisdata:/data"
      ]
    },
    "web": {
      "build": {
        "context": "../..",
        "dockerfile": ".boomlooper/workspace/Dockerfile"
      },
      "command": "bash -lc \" cd /workspace && pnpm --filter=web dev --host 0.0.0.0 \"\n",
      "environment": [
        "HOST=0.0.0.0",
        "NODE_ENV=development",
        "VITE_API_BASE_URL=",
        "VITE_WEB_BASE_URL=",
        "VITE_ADMIN_BASE_URL=",
        "VITE_ADMIN_BASE_PATH=/god-mode",
        "VITE_SPACE_BASE_URL=",
        "VITE_SPACE_BASE_PATH=/spaces",
        "VITE_LIVE_BASE_URL=",
        "VITE_LIVE_BASE_PATH=/live"
      ],
      "restart": "unless-stopped",
      "volumes": [
        "code:/workspace",
        "pnpm-store:/pnpm"
      ],
      "working_dir": "/workspace"
    },
    "workspace": {
      "build": {
        "context": "../..",
        "dockerfile": ".boomlooper/workspace/Dockerfile"
      },
      "command": "sleep infinity",
      "environment": [
        "PNPM_HOME=/pnpm",
        "DATABASE_URL=postgresql://plane:plane@plane-db:5432/plane",
        "REDIS_URL=redis://plane-redis:6379/",
        "POSTGRES_USER=plane",
        "POSTGRES_PASSWORD=plane",
        "POSTGRES_HOST=plane-db",
        "POSTGRES_DB=plane",
        "POSTGRES_PORT=5432",
        "RABBITMQ_HOST=plane-mq",
        "RABBITMQ_PORT=5672",
        "RABBITMQ_USER=plane",
        "RABBITMQ_PASSWORD=plane",
        "RABBITMQ_VHOST=plane",
        "SECRET_KEY=dev-secret-key-not-for-production",
        "DEBUG=1",
        "ALLOWED_HOSTS=*",
        "CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:80,http://localhost",
        "USE_MINIO=0",
        "AWS_ACCESS_KEY_ID=access-key",
        "AWS_SECRET_ACCESS_KEY=secret-key",
        "AWS_S3_BUCKET_NAME=uploads",
        "WEB_URL=http://localhost",
        "APP_BASE_URL=http://localhost",
        "ADMIN_BASE_URL=http://localhost",
        "ADMIN_BASE_PATH=/god-mode",
        "SPACE_BASE_URL=http://localhost",
        "SPACE_BASE_PATH=/spaces"
      ],
      "volumes": [
        "code:/workspace",
        "venv:/opt/venv",
        "pnpm-store:/pnpm"
      ],
      "working_dir": "/workspace"
    }
  },
  "volumes": {
    "bl-212f-code": {
      "external": true
    },
    "code": {
      "external": true,
      "name": "bl-212f-code"
    },
    "pgdata": null,
    "pnpm-store": null,
    "rabbitmq_data": null,
    "redisdata": null,
    "venv": null
  }
}