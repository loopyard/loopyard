{
  "services": {
    "dev": {
      "build": ".",
      "command": "sh -c \"bundle exec bin/rails tailwindcss:build && exec bundle exec bin/rails server -b 0.0.0.0 -p 3000\"",
      "depends_on": [
        "postgres",
        "redis"
      ],
      "environment": [
        "BINDING=0.0.0.0",
        "PORT=3000",
        "DB_HOST=postgres",
        "DB_PORT=5432",
        "POSTGRES_USER=postgres",
        "POSTGRES_DB=maybe_development",
        "DATABASE_URL=postgres://postgres@postgres:5432/maybe_development",
        "REDIS_URL=redis://redis:6379/0",
        "BUNDLE_PATH=/usr/local/bundle",
        "DISABLE_SPRING=1",
        "SELF_HOSTED=true"
      ],
      "ports": [
        "127.0.0.1:4001:3000"
      ],
      "volumes": [
        "code:/workspace",
        "bundle:/usr/local/bundle"
      ],
      "working_dir": "/workspace"
    },
    "postgres": {
      "environment": [
        "POSTGRES_HOST_AUTH_METHOD=trust",
        "POSTGRES_USER=postgres",
        "POSTGRES_DB=maybe_development"
      ],
      "image": "postgres:16",
      "volumes": [
        "postgres-data:/var/lib/postgresql/data"
      ]
    },
    "redis": {
      "image": "redis:7-alpine",
      "volumes": [
        "redis-data:/data"
      ]
    },
    "workspace": {
      "build": ".",
      "command": "sleep infinity",
      "depends_on": [
        "postgres",
        "redis"
      ],
      "environment": [
        "BINDING=0.0.0.0",
        "DB_HOST=postgres",
        "DB_PORT=5432",
        "POSTGRES_USER=postgres",
        "POSTGRES_DB=maybe_development",
        "DATABASE_URL=postgres://postgres@postgres:5432/maybe_development",
        "REDIS_URL=redis://redis:6379/0",
        "BUNDLE_PATH=/usr/local/bundle",
        "DISABLE_SPRING=1"
      ],
      "volumes": [
        "code:/workspace",
        "bundle:/usr/local/bundle"
      ],
      "working_dir": "/workspace"
    }
  },
  "volumes": {
    "bl-a8e3-code": {
      "external": true
    },
    "bundle": null,
    "code": {
      "external": true,
      "name": "bl-a8e3-code"
    },
    "postgres-data": null,
    "redis-data": null
  }
}