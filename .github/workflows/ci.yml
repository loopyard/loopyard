name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  LOOPYARD_HOME: ${{ github.workspace }}/.loopyard_home

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests with coverage
        env:
          LOOPYARD_LONG_TIMEOUTS: "1"
          MIX_ENV: test
        run: mix coveralls --exclude docker --exclude macos --exclude ssh --exclude terminal --exclude recovery --exclude slow
        timeout-minutes: 10

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps + PLT
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-quality-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-quality-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      # --- Hard gates (block merge) ---

      - name: Secret scan
        run: .github/scripts/secret-scan.sh tree

      - name: Check formatting
        run: mix format --check-formatted

      - name: Module cycle check
        # Elixir 1.18's `mix xref --format cycles` reports the same cycle once
        # per starting module, so a single ~6-module ChatAgent cycle expands
        # into ~35 reported "cycles". 1.19 dedupes properly. When CI moves
        # to 1.19, drop this back to 8.
        run: mix xref graph --format cycles --fail-above 40

      - name: Dependency audit
        run: mix deps.audit

      # --- Soft gates (report only, don't block) ---

      - name: Credo
        run: mix credo --strict
        continue-on-error: true

      - name: Sobelow (security)
        run: mix sobelow --config
        continue-on-error: true

      - name: Dialyzer
        run: |
          mkdir -p priv/plts
          mix dialyzer --plt
          mix dialyzer
        continue-on-error: true

  docker-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile
        run: mix compile

      - name: Pre-pull test images in parallel
        run: |
          for img in alpine:3.19 alpine:latest ubuntu:24.04 postgres:15 postgres:16 redis:7 redis:7-alpine; do
            docker pull "$img" &
          done
          wait

      - name: Run docker E2E tests
        env:
          LOOPYARD_LONG_TIMEOUTS: "1"
        run: mix test --only docker --exclude macos --exclude ssh --exclude terminal
        timeout-minutes: 15
